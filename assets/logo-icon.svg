<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#111827"/>
      <stop offset="100%" stop-color="#090d16"/>
    </linearGradient>
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff3366" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#7c5cff" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.9"/>
    </linearGradient>
    <linearGradient id="waveGrad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#ff3366"/>
      <stop offset="35%" stop-color="#c026d3"/>
      <stop offset="70%" stop-color="#7c5cff"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  
  <rect x="16" y="16" width="480" height="480" rx="110" fill="url(#bgGrad)" stroke="url(#borderGrad)" stroke-width="4"/>
  <rect x="36" y="36" width="440" height="440" rx="92" fill="none" stroke="rgba(255,255,255,0.06)" stroke-width="2"/>

  <g filter="url(#glow)">
    <rect x="108" y="216" width="28" height="80" rx="14" fill="url(#waveGrad)"/>
    <rect x="152" y="160" width="28" height="192" rx="14" fill="url(#waveGrad)"/>
    <rect x="196" y="110" width="28" height="292" rx="14" fill="url(#waveGrad)"/>
    <rect x="242" y="72" width="28" height="368" rx="14" fill="url(#waveGrad)"/>
    <rect x="288" y="130" width="28" height="252" rx="14" fill="url(#waveGrad)"/>
    <rect x="332" y="180" width="28" height="152" rx="14" fill="url(#waveGrad)"/>
    <rect x="376" y="226" width="28" height="60" rx="14" fill="url(#waveGrad)"/>
  </g>

  <circle cx="256" cy="72" r="6" fill="#ffffff" filter="url(#glow)"/>
  <circle cx="210" cy="110" r="5" fill="#ffffff" filter="url(#glow)"/>
  <circle cx="302" cy="130" r="5" fill="#ffffff" filter="url(#glow)"/>
</svg>
