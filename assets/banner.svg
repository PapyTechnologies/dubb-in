<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 640" width="1280" height="640">
  <defs>
    <radialGradient id="bgMesh" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#1e1b4b" stop-opacity="0.85"/>
      <stop offset="45%" stop-color="#0f172a" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#030712"/>
    </radialGradient>
    <radialGradient id="glowViolet" cx="30%" cy="35%" r="40%">
      <stop offset="0%" stop-color="#8b5cf6" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#8b5cf6" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowPink" cx="70%" cy="45%" r="40%">
      <stop offset="0%" stop-color="#ff3366" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#ff3366" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="70%" stop-color="#f1f5f9"/>
      <stop offset="100%" stop-color="#cbd5e1"/>
    </linearGradient>
    <linearGradient id="coralViolet" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ff3366"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
    <linearGradient id="pillGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(255,255,255,0.08)"/>
      <stop offset="100%" stop-color="rgba(255,255,255,0.03)"/>
    </linearGradient>
    <filter id="glowLarge" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Deep Cosmic Background -->
  <rect width="1280" height="640" fill="#030712"/>
  <rect width="1280" height="640" fill="url(#bgMesh)"/>
  <rect width="1280" height="640" fill="url(#glowViolet)"/>
  <rect width="1280" height="640" fill="url(#glowPink)"/>

  <!-- Subtle Tech Grid -->
  <g opacity="0.12" stroke="#38bdf8" stroke-width="1">
    <line x1="0" y1="160" x2="1280" y2="160" stroke-dasharray="4,8"/>
    <line x1="0" y1="320" x2="1280" y2="320" stroke-dasharray="4,8"/>
    <line x1="0" y1="480" x2="1280" y2="480" stroke-dasharray="4,8"/>
    <line x1="320" y1="0" x2="320" y2="640" stroke-dasharray="4,8"/>
    <line x1="640" y1="0" x2="640" y2="640" stroke-dasharray="4,8"/>
    <line x1="960" y1="0" x2="960" y2="640" stroke-dasharray="4,8"/>
  </g>

  <!-- App Icon Center -->
  <g transform="translate(570, 70)" filter="url(#glowLarge)">
    <rect width="140" height="140" rx="36" fill="#0b0f19" stroke="url(#coralViolet)" stroke-width="3"/>
    <rect x="28" y="58" width="8" height="24" rx="4" fill="url(#coralViolet)"/>
    <rect x="41" y="42" width="8" height="56" rx="4" fill="url(#coralViolet)"/>
    <rect x="54" y="28" width="8" height="84" rx="4" fill="url(#coralViolet)"/>
    <rect x="66" y="18" width="8" height="104" rx="4" fill="url(#coralViolet)"/>
    <rect x="79" y="33" width="8" height="74" rx="4" fill="url(#coralViolet)"/>
    <rect x="92" y="47" width="8" height="46" rx="4" fill="url(#coralViolet)"/>
    <rect x="105" y="60" width="8" height="20" rx="4" fill="url(#coralViolet)"/>
  </g>

  <!-- Main Title -->
  <text x="640" y="285" text-anchor="middle" font-family="'Space Grotesk', -apple-system, sans-serif" font-size="76" font-weight="800" fill="url(#titleGrad)" letter-spacing="-0.02em">
    Dubb<tspan fill="url(#coralViolet)">-in</tspan>
  </text>

  <!-- Tagline -->
  <text x="640" y="335" text-anchor="middle" font-family="'Space Grotesk', -apple-system, sans-serif" font-size="24" font-weight="600" fill="#94a3b8" letter-spacing="0.02em">
    Open-Source Autonomous AI Video Dubbing &amp; Voice Cloning Studio
  </text>
  <text x="640" y="370" text-anchor="middle" font-family="'Space Grotesk', -apple-system, sans-serif" font-size="18" font-weight="500" fill="#64748b">
    100% Local &amp; Private • Whisper VAD • XTTS-v2 Neural Cloning • Wav2Lip Lip-Sync
  </text>

  <!-- Feature Pills -->
  <g transform="translate(200, 430)">
    <!-- Pill 1 -->
    <rect x="0" y="0" width="190" height="46" rx="23" fill="url(#pillGrad)" stroke="rgba(255,51,102,0.4)" stroke-width="1.5"/>
    <text x="95" y="29" text-anchor="middle" font-family="'Space Grotesk', sans-serif" font-size="14" font-weight="700" fill="#ff6b8b">🧬 .dvf Fingerprints</text>

    <!-- Pill 2 -->
    <rect x="206" y="0" width="220" height="46" rx="23" fill="url(#pillGrad)" stroke="rgba(139,92,246,0.4)" stroke-width="1.5"/>
    <text x="316" y="29" text-anchor="middle" font-family="'Space Grotesk', sans-serif" font-size="14" font-weight="700" fill="#a78bfa">⚡ GTX 960 (2 GB VRAM)</text>

    <!-- Pill 3 -->
    <rect x="442" y="0" width="190" height="46" rx="23" fill="url(#pillGrad)" stroke="rgba(56,189,248,0.4)" stroke-width="1.5"/>
    <text x="537" y="29" text-anchor="middle" font-family="'Space Grotesk', sans-serif" font-size="14" font-weight="700" fill="#38bdf8">👄 Wav2Lip 960p</text>

    <!-- Pill 4 -->
    <rect x="648" y="0" width="232" height="46" rx="23" fill="url(#pillGrad)" stroke="rgba(34,197,94,0.4)" stroke-width="1.5"/>
    <text x="764" y="29" text-anchor="middle" font-family="'Space Grotesk', sans-serif" font-size="14" font-weight="700" fill="#4ade80">🌐 10 Dubbing Languages</text>
  </g>

  <!-- Footer Banner Badge -->
  <text x="640" y="560" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="13" font-weight="600" fill="#475569" letter-spacing="0.05em">
    RELEASE v0.1.0 • WINDOWS x64 • GPU CUDA / DIRECTML / CPU AUTONOMOUS
  </text>
</svg>
