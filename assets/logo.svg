<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 140" width="680" height="140">
  <defs>
    <linearGradient id="iconBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#090d16"/>
    </linearGradient>
    <linearGradient id="iconBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff3366"/>
      <stop offset="100%" stop-color="#7c5cff"/>
    </linearGradient>
    <linearGradient id="wave" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#ff3366"/>
      <stop offset="50%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
    <linearGradient id="txtGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#cbd5e1"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ff3366"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
    <filter id="glowSm" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Left Icon -->
  <g transform="translate(10, 10)">
    <rect x="0" y="0" width="120" height="120" rx="28" fill="url(#iconBg)" stroke="url(#iconBorder)" stroke-width="2.5"/>
    <g filter="url(#glowSm)">
      <rect x="24" y="50" width="7" height="20" rx="3.5" fill="url(#wave)"/>
      <rect x="35" y="36" width="7" height="48" rx="3.5" fill="url(#wave)"/>
      <rect x="46" y="24" width="7" height="72" rx="3.5" fill="url(#wave)"/>
      <rect x="57" y="15" width="7" height="90" rx="3.5" fill="url(#wave)"/>
      <rect x="68" y="28" width="7" height="64" rx="3.5" fill="url(#wave)"/>
      <rect x="79" y="40" width="7" height="40" rx="3.5" fill="url(#wave)"/>
      <rect x="90" y="52" width="7" height="16" rx="3.5" fill="url(#wave)"/>
    </g>
  </g>

  <!-- Typography -->
  <g transform="translate(150, 0)">
    <text x="0" y="78" font-family="'Space Grotesk', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="62" font-weight="800" fill="url(#txtGrad)" letter-spacing="-0.03em">Dubb<tspan fill="url(#accentGrad)">-in</tspan></text>
    
    <!-- Tagline & Status Indicator -->
    <circle cx="4" cy="106" r="4" fill="#22c55e" filter="url(#glowSm)"/>
    <text x="16" y="110" font-family="'Space Grotesk', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700" fill="#94a3b8" letter-spacing="0.08em">LOCAL AI VOICE DUBBING &amp; NEURAL CLONING STUDIO</text>
  </g>
</svg>
